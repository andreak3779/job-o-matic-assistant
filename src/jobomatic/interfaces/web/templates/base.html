<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job-o-matic{% endblock %} · Job-o-matic assistant</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('brand', name='job-o-matic-icon.svg') }}">
<link rel="icon" href="{{ url_for('brand', name='favicon.ico') }}">
<link rel="stylesheet" href="{{ url_for('brand', name='tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<meta name="htmx-config" content='{"selfRequestsOnly":true,"allowEval":false,"allowScriptTags":false,"historyEnabled":false,"includeIndicatorStyles":false}'>
<script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
</head>
<body>
<header class="brand">
  <div class="inner">
    <a class="mark" href="{{ url_for('home') }}">
      <img src="{{ url_for('brand', name='job-o-matic-icon.svg') }}" alt="" width="44" height="44">
      <span class="name">Job-o-matic assistant</span>
    </a>
    <nav aria-label="Pages">
      {% for page in pages %}<a href="{{ url_for(page.endpoint) }}">{{ page.label }}</a>{% endfor %}
    </nav>
  </div>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="page">This page runs on your computer only. Nothing is sent anywhere else.</footer>
</body>
</html>
