# Dependabot (ADR 0034): keep the pinned Python dependencies and the GitHub Actions current.
#
# Everything here is pinned on purpose: requirements-lock.txt holds exact versions (a pip
# constraints file; CI installs with `-c requirements-lock.txt`) and the Actions are pinned to
# commit SHAs. That makes the build reproducible, and it also means nothing upgrades itself. Dependabot opens
# the pull request; CI is the gate (install with the lock, the suite on Python 3.11 to 3.14, ruff,
# import contracts, mypy); a person reviews and merges.
#
# Noise control, learned from the CookingTime repository:
#   - Minor and patch updates of each ecosystem are ONE grouped pull request.
#   - Major updates of Python packages are ignored. A major bump (pydantic, flask, mcp) can change
#     behaviour and is a deliberate migration; raise it by hand when wanted. Security updates are
#     separate and are not held back by this.
#   - At most 3 open pull requests per ecosystem.
#   - A 7-day cooldown: a version is not proposed until it has been published for a week. A
#     brand-new release can be yanked or found to be compromised; waiting gives the ecosystem
#     time to notice. Security updates are not delayed by it.
#
# Not covered: the Dockerfile base image (`python:3.11-slim`). 3.11 is the supported floor
# (ADR 0033), so a bump to a newer tag would be a decision, not an update.

version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    commit-message:
      prefix: "build"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
