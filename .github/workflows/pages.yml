name: Pages

# Publishes site/ (a single static page) to GitHub Pages. The logo, icons and social preview
# are copied in from their one home in the repo, so there is only one copy of each to maintain.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/jobomatic/branding/**'
      - 'docs/assets/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/index.html
          cp src/jobomatic/branding/* _site/assets/
          cp docs/assets/social-preview.png _site/assets/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
